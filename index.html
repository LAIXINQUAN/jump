<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>公益网页跳转站</title>
<meta name="description" content="公益网页跳转站：集中收录优质公益资源链接，一键直达。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <!-- 顶栏（管理入口已隐藏，开发者访问 /admin.html 进入后台） -->
  <header class="topbar">
    <div class="brand"><i>↗</i>公益网页跳转站</div>
  </header>

  <!-- 跳转链接列表 -->
  <section class="card">
    <h1 class="card-title">可跳转的公益资源</h1>
    <p class="card-sub">点击即可进入中转页，确认后跳转至目标网址。</p>
    <div id="linkList" class="link-list">
      <div class="empty">正在加载…</div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
/**
 * 首页脚本：加载 links.json 并渲染跳转项列表。
 * 每个跳转项指向本项目的数字中转页（如 /jump/1）。
 */
document.addEventListener('DOMContentLoaded', init);

/**
 * HTML 转义，防止数据中的特殊字符破坏结构
 * @param {string} str 原始文本
 * @returns {string} 转义后的安全文本
 */
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**
 * 初始化首页：读取链接数据并渲染
 */
async function init() {
  const box = document.getElementById('linkList');
  if (!box) return;

  try {
    const res = await fetch('links.json', { cache: 'no-store' });
    const links = await res.json();
    if (!Array.isArray(links) || !links.length) {
      box.innerHTML = '<div class="empty">暂无可跳转的链接，请到后台添加。</div>';
      return;
    }
    // 按 id 升序渲染
    links.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (item) {
      const a = document.createElement('a');
      a.className = 'link-item';
      a.href = item.id; // 相对路径：跳转到 /jump/<id>，由 404.html 中转
      a.innerHTML =
        '<span class="link-id">' + escapeHtml(item.id) + '</span>' +
        '<span class="link-info">' +
          '<span class="link-name">' + escapeHtml(item.name) + '</span>' +
          '<div class="link-url">' + escapeHtml(item.url) + '</div>' +
        '</span>' +
        '<span class="link-go">前往 →</span>';
      box.appendChild(a);
    });
  } catch (e) {
    box.innerHTML = '<div class="empty">链接数据加载失败，请稍后重试。</div>';
  }
}
</script>
</body>
</html>
